{% extends 'base.html'%}
{% block content %}

<div class="w3-card-4 w3-white w3-round-xlarge w3-animate-top"
     style="width:60%;margin:auto;padding:25px;">

    <div class="w3-right">
        <a href="/" class="w3-button w3-light-grey w3-round">
            BACK TO LOGIN
        </a>
    </div>

    <div style="clear:both"></div>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="w3-panel w3-pale-blue w3-border">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <div style="width:80%;margin:auto;">

        <h2 class="w3-center">CREATE ACCOUNT</h2>

        <form action="/signup" method="post">

            <p>
                <label><b>E-MAIL</b></label>
                <input type="email" name="email"
                       class="w3-input w3-border"
                       placeholder="Enter Email" required />
            </p>
			<p>
				<label><b>PASSWORD</b></label>
				<div style="position:relative;">
					<input type="password" name="password"
						   id="signuppassword"
						   class="w3-input w3-border"
						   placeholder="Enter Password"
						   style="padding-right:45px;" required />
				</div>
			</p>
			<p>
				<label><b>CONFIRM PASSWORD</b></label>
				<div style="position:relative;">
					<input type="password" name="confirm_password"
						   id="confirmpassword"
						   class="w3-input w3-border"
						   placeholder="Confirm Password"
						   style="padding-right:45px;" required />
				</div>
			</p>
            <p class="w3-right">
                <input type="submit" value="REGISTER"
                       class="w3-button w3-indigo w3-round" />
            </p>

            <div style="clear:both"></div>

        </form>
    </div>
</div>

{% endblock %}
